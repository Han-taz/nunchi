name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [develop, main]
  schedule:
    - cron: "17 18 * * *"

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PG_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  db-tests:
    name: db-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the suite twice on fresh databases
        run: |
          psql --version
          for run in 1 2; do
            echo "::group::run $run"
            scripts/db-test.sh --url "$PG_URL" --profile current --results "$RUNNER_TEMP/results-$run.tsv"
            echo "::endgroup::"
          done
          diff "$RUNNER_TEMP/results-1.tsv" "$RUNNER_TEMP/results-2.tsv"

  mutation-gate:
    name: mutation-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the suite against the known-vulnerable schema
        run: scripts/db-test.sh --url "$PG_URL" --profile vulnerable

  sql-lint:
    name: sql-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install pinned tools
        run: |
          pip install --require-hashes --no-deps -r .github/tools/requirements.txt
          npm ci --ignore-scripts --prefix .github/tools
      - name: sqlfluff
        run: sqlfluff lint .
      - name: sqlfluff linted every tracked .sql file
        run: |
          sqlfluff lint . --format json > "$RUNNER_TEMP/sqlfluff.json"
          python3 - "$RUNNER_TEMP/sqlfluff.json" <<'PY'
          import json, os, subprocess, sys

          linted = {d["filepath"] for d in json.load(open(sys.argv[1]))}
          tracked = subprocess.run(
              ["git", "ls-files", "*.sql"], check=True, capture_output=True, text=True
          ).stdout.split()
          ignored = []
          for line in open(".sqlfluffignore"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              if any(c in line for c in "*?[!"):
                  sys.exit(f".sqlfluffignore: unsupported pattern {line!r}: only exact paths and dir/ prefixes")
              ignored.append(line)
          expected = {f for f in tracked if not any(f == i or (i.endswith("/") and f.startswith(i)) for i in ignored)}
          missing = sorted(expected - linted)
          extra = sorted(linted - expected)
          print(f"tracked={len(tracked)} ignored={len(tracked) - len(expected)} expected={len(expected)} linted={len(linted)}")
          if missing or extra:
              sys.exit(f"sqlfluff coverage mismatch: not linted={missing} unexpectedly linted={extra}")
          PY
      - name: squawk
        run: .github/tools/node_modules/.bin/squawk --config .squawk.toml db/schema.sql

  markdown:
    name: markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Relative links (lychee, offline)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --include-fragments --no-progress './README.md' './docs/**/*.md' './.github/*.md'
          jobSummary: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: markdownlint-cli2
        run: |
          npm ci --ignore-scripts --prefix .github/tools
          .github/tools/node_modules/.bin/markdownlint-cli2 "**/*.md"

  external-links:
    name: external-links (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: External links (lychee, online)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --no-progress --max-retries 3 --retry-wait-time 5 --accept '200..=299,429' './README.md' './docs/**/*.md'

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the working tree and the full history
        run: |
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --no-banner --verbose
          "$RUNNER_TEMP/gitleaks" detect --source . --no-git --redact --no-banner --verbose

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned tools
        run: pip install --require-hashes --no-deps -r .github/tools/requirements.txt
      - name: actionlint
        run: actionlint -color
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona regular .github

  shell:
    name: shell
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned tools
        run: pip install --require-hashes --no-deps -r .github/tools/requirements.txt
      - name: shellcheck
        run: find scripts -name '*.sh' -print0 | xargs -0 shellcheck -S style

  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned tools
        run: pip install --require-hashes --no-deps -r .github/tools/requirements.txt
      - name: editorconfig (covers trailing whitespace, final newline, line endings)
        run: ec
      - name: typos
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  commits:
    name: commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check the commit range
        if: github.event_name != 'schedule'
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            base="${HEAD_SHA}~1"
          else
            base="$PUSH_BEFORE"
          fi
          scripts/ci/check-commits.sh "$base" "$HEAD_SHA"

  pr-size:
    name: pr-size
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Count changed lines
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/pr-size.sh "$PR_BASE" "$HEAD_SHA" 800
      - name: Self-test the size gate
        run: scripts/ci/pr-size-selftest.sh

  codeql:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: actions
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:actions

  app-lint:
    name: app-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.22"
          enable-cache: false
      - name: Install the locked environment
        run: uv sync --locked
      - name: ruff lint
        run: uv run ruff check
      - name: ruff format
        run: uv run ruff format --check
      - name: mypy --strict
        run: uv run mypy --strict src tests
      - name: deptry
        run: uv run deptry .

  app-tests:
    name: app-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.22"
          enable-cache: false
      - name: Install the locked environment
        run: uv sync --locked
      - name: pytest (warnings are errors, 100% coverage of the skeleton)
        env:
          NUNCHI_TEST_ADMIN_URL: ${{ env.PG_URL }}
        run: uv run pytest
      - name: diff-cover (80% of changed lines)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: uv run diff-cover coverage.xml --compare-branch="$PR_BASE" --fail-under=80

  schema-drift:
    name: schema-drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.22"
          enable-cache: false
      - name: Install the locked environment
        run: uv sync --locked
      - name: schema.sql and the migrations must build the same schema
        run: scripts/ci/schema-drift.sh --url "$PG_URL"

  app-mutation:
    name: app-mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.22"
          enable-cache: false
      - name: Install the locked environment
        run: uv sync --locked
      - name: mutmut on changed modules (pull request) or every module (otherwise)
        env:
          NUNCHI_TEST_ADMIN_URL: ${{ env.PG_URL }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci/mutation-gate.sh "$PR_BASE" 80

  app-audit:
    name: app-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.22"
          enable-cache: false
      - name: Install the locked environment
        run: uv sync --locked
      - name: pip-audit (any known vulnerability fails)
        run: uv export --locked --all-groups --no-emit-project | uv run pip-audit -r /dev/stdin --require-hashes --disable-pip

  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.22"
          enable-cache: false
      - name: Install the locked environment
        run: uv sync --locked
      - name: Semgrep rules test
        run: cd .semgrep && uv run semgrep --test --metrics=off .
      - name: Semgrep scan
        run: >-
          uv run semgrep scan --metrics=off --error
          --config p/python --config p/secrets --config .semgrep/sql-injection.yml src tests

  docker-build:
    name: docker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (scanning and SBOM arrive with the release pipeline)
        run: docker build --tag nunchi:ci .

  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - db-tests
      - mutation-gate
      - sql-lint
      - markdown
      - secrets
      - workflow-lint
      - shell
      - hygiene
      - commits
      - pr-size
      - codeql
      - app-lint
      - app-tests
      - schema-drift
      - app-mutation
      - app-audit
      - semgrep
      - docker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if ! jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null; then
            echo "::error::a required job did not succeed (failure, cancelled and skipped all count as failing)"
            exit 1
          fi
