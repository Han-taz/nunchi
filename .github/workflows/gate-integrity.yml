name: gate-integrity

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: gate-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate-integrity:
    name: gate-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_REF: refs/remotes/pr/head
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pull request head as data
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
      - name: Report gate files the pull request touches
        run: scripts/ci/gate-files-report.sh "$BASE_SHA" "$HEAD_REF"
      - name: Base pr-size.sh
        if: ${{ !cancelled() }}
        run: scripts/ci/pr-size.sh "$BASE_SHA" "$HEAD_REF" 800
      - name: Base migrations-immutable.sh
        if: ${{ !cancelled() }}
        run: scripts/ci/migrations-immutable.sh "$BASE_SHA" "$HEAD_REF"
      - name: Base check-commits.sh
        if: ${{ !cancelled() }}
        run: scripts/ci/check-commits.sh "$BASE_SHA" "$HEAD_REF"
      - name: Base expectations registry guard
        if: ${{ !cancelled() }}
        run: scripts/ci/expectations-guard.sh "$BASE_SHA" "$HEAD_REF"
