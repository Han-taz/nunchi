[project]
name = "nunchi"
version = "0.0.0"
description = "Team memory service with database-enforced access control"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "psycopg[binary]>=3.3.6",
  "psycopg-pool>=3.2",
  "pydantic>=2.9",
  "fastapi>=0.115",
  "pydantic-settings>=2.6",
  "anthropic>=1.13.0",
  # >=2.15: PyJWKClient rate-limits forced JWKS refreshes on unknown kids (cooldown_duration)
  "pyjwt[crypto]>=2.15,<3",
  "mcp>=1.29.0",
  "anyio>=4.15.1",
  "starlette>=0.40",
  "uvicorn>=0.54.0",
  "httpx>=0.28.1",
  "websockets>=15",
]

[dependency-groups]
dev = [
  "cryptography>=43",
  "deptry>=0.21",
  "diff-cover>=9.2",
  "httpx2>=2.13.1",
  "hypothesis>=6.120",
  "mutmut>=3.2",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "semgrep>=1.181.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nunchi"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Semgrep rule-test fixtures contain deliberately bad SQL and need no annotations
extend-exclude = [".semgrep"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B", "UP", "SIM", "PL", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
# assert is the test idiom; the PL magic-value rule fires on every expected literal
"tests/**" = ["S101", "PLR2004"]
# one-shot script with long SQL string literals that read better unbroken
"scripts/migrate-v1.3.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --strict-markers --cov=nunchi --cov-branch --cov-report=term-missing --cov-report=xml"
markers = ["db: needs the Postgres server named by NUNCHI_TEST_ADMIN_URL"]

[tool.coverage.run]
# eval/ (memory-quality harness, needs real model calls) is not app code and stays out of coverage
source = ["nunchi"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.deptry]
known_first_party = ["nunchi"]

[tool.deptry.per_rule_ignores]
# never imported: psycopg-binary (the [binary] extra), uvicorn (`uvicorn --factory nunchi.api.serve:create`)
DEP002 = ["psycopg-binary", "uvicorn"]

[tool.mutmut]
source_paths = ["src/nunchi/"]
pytest_add_cli_args = ["--no-cov"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["db/migrations/", "tests/", "eval/", "scripts/"]
