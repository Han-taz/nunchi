[project]
name = "nunchi"
version = "0.0.0"
description = "Team memory service with database-enforced access control"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
  "deptry>=0.21",
  "diff-cover>=9.2",
  "hypothesis>=6.120",
  "mutmut>=3.2",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "semgrep>=1.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nunchi"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Semgrep rule-test fixtures contain deliberately bad SQL and need no annotations
extend-exclude = [".semgrep"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B", "UP", "SIM", "PL", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
# assert is the test idiom; the PL magic-value rule fires on every expected literal
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --strict-markers --cov=nunchi --cov-branch --cov-report=term-missing --cov-report=xml"
markers = ["db: needs the Postgres server named by NUNCHI_TEST_ADMIN_URL"]

[tool.coverage.run]
source = ["nunchi"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.deptry]
known_first_party = ["nunchi"]

[tool.mutmut]
source_paths = ["src/nunchi/"]
pytest_add_cli_args = ["--no-cov"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["db/migrations/", "tests/"]
