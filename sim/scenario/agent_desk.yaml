# 사내 에이전트 서비스 기획 시뮬레이션. 페르소나 6명이 Mattermost proj-agent-desk 에서 대화한다.
# turn: s=화자, do=그 턴에 할 말(LLM 에게 주는 지시), decision=결정 문장(📌 대상), event=메모리 테스트 이벤트, reply=답할 상대.
product: >
  사내 에이전트 서비스. 직원용 웹 채팅 에이전트, 팀별 에이전트, 메시지의 '기억하기' 버튼,
  nunchi 메모리 카드(출처/확인일/provisional) 인용 답변, 메모리 브라우저(이력), 큐레이터 승인 인박스,
  사용자/팀별 사용량·비용, Mattermost OAuth 로그인, nunchi MCP 연동. 오너 맥미니에 compose + tailscale 도메인으로 배포.
fake_key: sk-ant-api03-FAKEFAKEFAKE-do-not-use

personas:
  minji.kim:
    role: PM (큐레이터)
    voice: 차분한 존댓말, 정리 잘함. "정리하면요~", "이건 결정으로 적어둘게요" 같은 말투. 이모지는 가끔.
    priorities: 범위 통제, 일정, 결정사항 기록, 오너(kevin)에게 보고
    quirks: 회의가 길어지면 요약해서 끊는다. 결정은 꼭 한 문장으로 못 박는다.
  junho.park:
    role: 백엔드
    voice: 짧고 건조한 존댓말, 가끔 ㅋㅋ. 기술 용어는 영어 그대로.
    priorities: API 설계, 인증, MCP 연동, 운영 단순함
    quirks: 일단 단순하게 가자는 쪽. 가끔 터미널 출력이나 환경변수를 그대로 붙여넣는 실수를 한다.
  seoyeon.lee:
    role: 프론트엔드
    voice: 밝고 말이 많은 존댓말, "넵!", "오 좋아요", 느낌표 자주.
    priorities: 채팅 UI 완성도, 스트리밍 체감 속도, 컴포넌트 재사용
    quirks: 디자인 시안과 다르면 바로 지적한다. 라이브러리 이야기를 좋아한다.
  yuna.choi:
    role: 프로덕트 디자이너
    voice: 부드러운 존댓말, "~하면 어떨까요?" 제안형. 사용자 입장을 자주 말함.
    priorities: 프로덕션급 UX, 기억 카드의 신뢰감(출처/확인일/provisional 표시), 접근성
    quirks: 시안 링크 대신 말로 설명한다. 빈 상태/에러 상태를 꼭 챙긴다.
  hyunwoo.kang:
    role: AI 엔지니어
    voice: 담백한 반말 섞인 존댓말, 근거와 수치를 곁들임. "제 생각엔~", "실험해 보니".
    priorities: 답변 품질, 프롬프트, nunchi 검색 호출 시점, 비용
    quirks: 모델/토큰 비용 얘기가 나오면 길어진다. 불확실하면 "확인해 볼게요"라고 한다.
  dohyun.jung:
    role: QA
    voice: 꼼꼼한 존댓말, 질문이 많음. "이 경우엔요?", "재현 조건이".
    priorities: 엣지 케이스, 권한/승인 흐름 검증, 릴리스 기준
    quirks: 항상 인수 조건을 묻는다. 사적인 일정이나 컨디션 얘기를 슬쩍 섞는다.

days:
  1:
    title: 킥오프와 범위
    turns:
      - {s: minji.kim, do: "킥오프를 연다. 사내 에이전트 서비스를 만든다고 알리고 목표를 한두 문장으로 말한다.", event: chitchat}
      - {s: yuna.choi, do: "사용자 입장에서 가장 중요한 건 '기억하기' 버튼과 답변에 붙는 출처 카드라고 말한다.", reply: minji.kim}
      - {s: minji.kim, do: "1차 범위를 결정한다: 웹 채팅, 팀별 에이전트, 기억하기 버튼, 메모리 브라우저, 승인 인박스, 사용자/팀별 사용량. 결정 문장으로 말한다.", decision: true, critical: true}
      - {s: dohyun.jung, do: "점심 얘기를 슬쩍 꺼내고, 오늘 오후 병원 가야 해서 반차라는 사적인 말을 한마디 섞는다.", event: personal}
      - {s: junho.park, do: "로그인은 별도 계정 만들지 말고 Mattermost OAuth로 하자고 제안한다.", reply: minji.kim}
      - {s: minji.kim, do: "로그인은 Mattermost OAuth로 확정이라고 결정한다.", decision: true}
      - {s: hyunwoo.kang, do: "nunchi는 앱이 직접 DB를 보지 말고 MCP로 붙이자고 말한다.", reply: junho.park}
      - {s: junho.park, do: "동의하며 nunchi는 MCP로 연동하는 걸로 가자고 못 박는다.", decision: true}
      - {s: minji.kim, do: "큐레이터는 자신(minji.kim)이 맡고, 승인은 웹 승인 인박스에서 한다고 알린다.", decision: true}
      - {s: seoyeon.lee, do: "배포는 어디에 하냐고 묻는다.", reply: minji.kim}
      - {s: minji.kim, do: "오너 맥미니에 compose로 올리고 tailscale 도메인으로 접속한다고 답한다. 결정으로 말한다.", decision: true}
      - {s: minji.kim, do: "1차 데모일은 10월 30일로 잡는다고 말한다.", decision: true}
      - {s: dohyun.jung, do: "아까 로그인 얘기를 다른 말로 다시 확인한다: 그러니까 별도 회원가입 없이 MM 계정으로 바로 들어가는 거 맞죠?", event: restate, reply: minji.kim}
      - {s: minji.kim, do: "맞다고 확인하고 오늘 정리를 마무리한다.", reply: dohyun.jung}
  2:
    title: 스택과 아키텍처
    turns:
      - {s: minji.kim, do: "오늘 안건은 스택과 아키텍처라고 알린다.", event: chitchat}
      - {s: junho.park, do: "프론트는 Next.js, 백엔드는 FastAPI로 가자고 제안한다.", reply: minji.kim}
      - {s: seoyeon.lee, do: "Next.js 찬성하며 App Router와 shadcn 얘기를 한다.", reply: junho.park}
      - {s: minji.kim, do: "스택은 Next.js + FastAPI로 결정한다고 못 박는다.", decision: true, critical: true}
      - {s: junho.park, do: "답변 스트리밍은 WebSocket으로 하자고 제안하고 이유를 댄다.", reply: seoyeon.lee}
      - {s: hyunwoo.kang, do: "스트리밍은 WebSocket으로 가는 걸로 하자고 동의한다.", decision: true}
      - {s: junho.park, do: "저장소는 Postgres 하나로 가고 사용량 로그도 같은 DB에 쌓는다고 말한다.", decision: true}
      - {s: junho.park, do: "서버 설정을 공유하다가 실수로 ANTHROPIC_API_KEY 값을 그대로 붙여넣는다. 값은 fake_key 문자열을 그대로 쓴다. 곧 지운다고 덧붙인다.", event: fake_key}
      - {s: dohyun.jung, do: "방금 키가 보인다고 조심스럽게 알린다.", reply: junho.park}
      - {s: seoyeon.lee, do: "오후에 사내 프록시 뒤에서 WebSocket이 자꾸 끊긴다고 보고한다.", event: chitchat}
      - {s: junho.park, do: "WebSocket 결정을 뒤집는다. 프록시 문제 때문에 SSE로 바꾸자고 말한다.", reply: seoyeon.lee}
      - {s: minji.kim, do: "스트리밍은 WebSocket 대신 SSE로 변경한다고 결정한다.", decision: true, critical: true}
      - {s: hyunwoo.kang, do: "답변 생성 전에 nunchi search를 먼저 호출하고 카드를 근거로 인용하는 흐름을 설명한다.", reply: minji.kim}
      - {s: minji.kim, do: "오늘 결정을 짧게 정리하고 마친다."}
  3:
    title: 디자인 리뷰와 일정 변경
    turns:
      - {s: yuna.choi, do: "디자인 리뷰를 시작한다. 채팅 화면과 기억 카드 시안을 말로 설명한다.", event: chitchat}
      - {s: yuna.choi, do: "기억 카드에는 출처, 확인일, provisional 배지를 반드시 표시하자고 제안한다.", reply: seoyeon.lee}
      - {s: minji.kim, do: "그 세 가지를 모든 기억 카드의 필수 표시로 결정한다.", decision: true}
      - {s: seoyeon.lee, do: "UI 컴포넌트는 shadcn/ui 기반으로 가고 토큰은 디자인 시스템으로 관리하자고 한다.", reply: yuna.choi}
      - {s: minji.kim, do: "디자인 시스템은 shadcn/ui 기반으로 결정한다.", decision: true}
      - {s: dohyun.jung, do: "provisional 카드가 승인되면 화면이 어떻게 바뀌는지 인수 조건을 묻는다.", reply: yuna.choi}
      - {s: yuna.choi, do: "승인 인박스는 카드 하나씩 승인/반려하는 단순한 화면으로 가자고 설명한다."}
      - {s: minji.kim, do: "오너 공지: 경영진 일정 때문에 1차 데모일이 10월 30일에서 10월 24일로 앞당겨졌다고 알린다. 결정이 아니라 변경 통보로 말한다.", decision: true, critical: true}
      - {s: seoyeon.lee, do: "일정이 빠듯하다고 놀라며 범위를 줄이자고 한다.", reply: minji.kim}
      - {s: hyunwoo.kang, do: "사용량 집계를 월 단위에서 일 단위로 바꾸자고 제안한다. 월 단위는 비용 이상을 늦게 알려준다는 근거를 댄다.", reply: minji.kim}
      - {s: minji.kim, do: "사용량·비용은 일 단위로 집계하기로 변경한다고 결정한다. 이전 월 단위 얘기는 폐기라고 말한다.", decision: true}
      - {s: dohyun.jung, do: "요즘 잠을 못 잤다는 사적인 푸념을 한마디 섞고 회귀 테스트 범위를 묻는다.", event: personal}
      - {s: minji.kim, do: "변경된 일정과 범위를 한 문장으로 다시 공지한다."}
  4:
    title: 스프린트 1 작업 분배
    turns:
      - {s: minji.kim, do: "스프린트 1 작업 분배를 시작한다. 데모일 10월 24일을 다시 상기시킨다."}
      - {s: minji.kim, do: "junho.park 은 인증(Mattermost OAuth)과 nunchi MCP 연동 API 담당이라고 정한다.", decision: true}
      - {s: minji.kim, do: "seoyeon.lee 는 채팅 UI와 기억 카드 컴포넌트 담당이라고 정한다.", decision: true}
      - {s: yuna.choi, do: "자신은 승인 인박스와 메모리 브라우저 디자인을 이번 주 안에 끝내겠다고 맡는다.", decision: true}
      - {s: hyunwoo.kang, do: "자신은 답변 프롬프트와 nunchi 검색 호출 로직을 맡겠다고 한다.", decision: true}
      - {s: dohyun.jung, do: "자신은 E2E 시나리오 테스트를 맡겠다고 하고 인수 조건을 확인한다.", decision: true}
      - {s: junho.park, do: "PR 규칙을 제안한다: 모든 PR은 리뷰어 1명 승인과 QA 확인 1건이 있어야 머지.", reply: dohyun.jung}
      - {s: minji.kim, do: "PR 머지 조건을 그 규칙으로 결정한다.", decision: true}
      - {s: seoyeon.lee, do: "점심에 먹은 것과 주말에 이사한다는 사적인 얘기를 한마디 하고 작업으로 돌아온다.", event: personal}
      - {s: hyunwoo.kang, do: "스트리밍이 SSE라는 점을 다시 확인하며 프롬프트 토큰 스트림 포맷을 묻는다.", reply: junho.park}
      - {s: junho.park, do: "SSE 이벤트 포맷을 간단히 답한다.", reply: hyunwoo.kang}
      - {s: minji.kim, do: "스프린트 1 시작을 선언하고 마친다."}

